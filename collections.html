---
layout: default
title: Astrophotography Collections
permalink: /collections.html
---
<div class="w3-container w3-center w3-bottombar">
    <h1>PHOTO COLLECTIONS</h1>
</div>

<div id="gallery" class="w3-padding">
    {% for lst in site.lists %}
    <div class="w3-panel w3-pale-blue w3-leftbar w3-rightbar w3-border-blue">
        <h3><a href="{{site.baseurl}}{{lst.url}}">{{ lst.title }}</a></h3>
        <hr>
        <div style="text-align: right;">
            {{lst.items.size}} items
        </div>
        <p>{{ lst.description }}</p>
        <div style="text-align: right;">
            <a class="w3-button flat" href="{{site.baseurl}}{{lst.url}}">See Items</a>
        </div>
    </div>
    {% endfor %}
</div>
